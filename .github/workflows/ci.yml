name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      runLint:
        description: 'Run the static linter'     
        required: false
        default: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
        
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          submodules: "true"
      
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c #v6.0.0
        with:
          python-version: "3.10"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build in the dev container image
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 #v0.3.1900000417
        with:
            imageName: ghcr.io/gradleup/gradleup.github.io-builder
            cacheFrom: ghcr.io/gradleup/gradleup.github.io-builder
            push: never
            runCmd: |
              mkdocs build
            env: |
              FULL_BUILD=true
      
      - name: Lint the static site
        uses: anishathalye/proof-html@acec311c40ea13c9ffa6490e77ac67f52594f403 #v2.2.2
        if: ${{ inputs.runLint }}
        with:
          directory: ./_site
          enforce_https: false
          tokens: |
            {"https://github.com": "${{ secrets.GITHUB_TOKEN }}"}
          ignore_url: |
             https://fonts.gstatic.com
